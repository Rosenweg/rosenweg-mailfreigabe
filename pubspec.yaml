name: rosenweg_mailfreigabe
description: "Rosenweg Mail-Freigabe – Mails der Verwaltung prüfen und freigeben – mit Benachrichtigung, sobald eine wartet."
publish_to: 'none'

# version: x.y.z+Baunummer. Ein Merge auf main mit einer NEUEN Version (Tag
# vx.y.z gibt es noch nicht) baut alle Plattformen und veroeffentlicht sie
# (GitHub-Release, /apps). Unveraenderte Version = nur CI, kein Release.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # nur fuer die Vorfuehrdaten (lib/attrappe.dart): Anhang ohne Server
  http: ^1.6.0
  # Gemeinsame Basis der Rosenweg-Apps: Anmeldung (Karte, QR, Konto, still per
  # Kerberos), API, Gerüst (Handy/Desktop), Updater, Logo-Baukasten.
  # Oeffentliches Repo: pub holt es ohne Token; lokal mit ../rosenweg-basis
  # ueber pubspec_overrides.yaml (siehe README, "Entwickeln").
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      # bis Tag v0.8.0 steht: Commit von Basis-PR #31 (Benachrichtigung, HintergrundAbfrage)
      ref: ee39ddfa6077d853409e730446b144c38acdd22a

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Logo fuer Anmeldeschirm, "Über" und Titelleiste (assets/logo/erzeugen.sh)
  assets:
    - assets/logo/rosenweg-mailfreigabe-512.png
    - assets/logo/rosenweg-mailfreigabe-klein.png
